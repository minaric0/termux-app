name: SM-A175N Termux Performance ARM64

on:
  push:
    branches:
      - perf/sm-a175n-android17-20261117
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout optimized fork
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 36 platform and upstream NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platforms;android-36' 'ndk;29.0.14206865'
      - name: Verify Android 17 Termux execution compatibility
        run: |
          grep -q '^targetSdkVersion=28$' gradle.properties
          grep -q 'SM_A175N_PTY_BATCH_V1' terminal-emulator/src/main/java/com/termux/terminal/TerminalSession.java
          grep -q 'namespace "com.termux"' app/build.gradle
      - name: Build ARM64 debug APK
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
          TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS: '1'
          TERMUX_APP_VERSION_NAME: '0.118.0+sm-a175n-perf1'
          TERMUX_APK_VERSION_TAG: 'sm-a175n-perf1'
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
          ls -lh app/build/outputs/apk/debug/
          test "$(find app/build/outputs/apk/debug -maxdepth 1 -name '*arm64-v8a.apk' | wc -l)" -eq 1
          sha256sum app/build/outputs/apk/debug/*arm64-v8a.apk > SM-A175N-SHA256SUMS.txt
      - name: Publish ARM64 build
        uses: actions/upload-artifact@v4
        with:
          name: SM-A175N-Termux-Perf-arm64-debug
          path: |
            app/build/outputs/apk/debug/*arm64-v8a.apk
            SM-A175N-SHA256SUMS.txt
          if-no-files-found: error
